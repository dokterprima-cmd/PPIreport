        function useAppDatabase(collectionName, initialData) {
            const [data, setData] = useState(initialData);

            useEffect(() => {
                if (isFirebaseConfigured && db) {
                    const unsub = db.collection(collectionName).onSnapshot((snapshot) => {
                        const items = [];
                        snapshot.forEach((doc) => items.push({ id: doc.id, ...doc.data() }));
                        setData(items.length > 0 ? items : initialData);
                    });
                    return () => unsub();
                } else {
                    try {
                        const item = window.localStorage.getItem(`ppi_${collectionName}`);
                        if (item) setData(JSON.parse(item));
                        else setData(initialData); // Use defaults if empty
                    } catch (error) {
                        console.error(error);
                    }
                }
            }, [collectionName]);

            const saveData = async (newDataArray) => {
                if (isFirebaseConfigured && db) {
                   for (const item of newDataArray) {
                       await db.collection(collectionName).doc(String(item.id)).set(item);
                   }
                } else {
                   setData(newDataArray);
                   window.localStorage.setItem(`ppi_${collectionName}`, JSON.stringify(newDataArray));
                }
            };

            const deleteItem = async (id, updatedArray) => {
                if (isFirebaseConfigured && db) {
                    await db.collection(collectionName).doc(String(id)).delete();
                } else {
                    setData(updatedArray);
                    window.localStorage.setItem(`ppi_${collectionName}`, JSON.stringify(updatedArray));
                }
            }

            return [data, saveData, deleteItem];
        }

        const calculateCompliance = (answers) => {
            const keys = Object.keys(answers).filter(k => answers[k] === 'Y' || answers[k] === 'T');
            if (keys.length === 0) return 0;
            return Math.round((keys.filter(k => answers[k] === 'Y').length / keys.length) * 100);
        };

        function DashboardModule({ audits, surveilans, denominators, kewaspadaan, units }) {
            const [filterMonth, setFilterMonth] = useState(new Date().toISOString().slice(0,7)); 
            const [filterUnit, setFilterUnit] = useState('ALL');

            const { rateData, kewasChartData, bundleChartData, kpi } = useMemo(() => {
                const vSurv = surveilans.filter(s => s.status === 'VERIFIED' && s.metadata.bulan === filterMonth && (filterUnit === 'ALL' || s.metadata.unit === filterUnit));
                const vAud = audits.filter(a => a.status === 'VERIFIED' && a.metadata.tanggal.startsWith(filterMonth) && (filterUnit === 'ALL' || a.metadata.unit === filterUnit));
                
                let den = { hr:0, kat:0, cvc:0, vent:0, iv:0, op:0 };
                denominators.filter(d => d.bulan === filterMonth && (filterUnit === 'ALL' || d.unit === filterUnit)).forEach(d => {
                    den.hr += d.hariRawat; den.kat += d.hariKateter; den.cvc += d.hariCVC; den.vent += d.hariVentilator; den.iv += d.hariIVLine; den.op += d.jumlahOperasi;
                });

                let c = { isk:0, iadp:0, vap:0, pleb:0, ido:0 };
                vSurv.forEach(s => { c.isk += s.data.ISK.length; c.iadp += s.data.IADP.length; c.vap += s.data.VAP.length; c.pleb += s.data.PLEBITIS.length; c.ido += s.data.IDO.length; });

                const rData = [
                    { name: 'ISK (‰)', rate: den.kat>0 ? Number(((c.isk/den.kat)*1000).toFixed(2)) : 0, target: TARGETS.ISK, case: c.isk, dn: den.kat },
                    { name: 'IADP (‰)', rate: den.cvc>0 ? Number(((c.iadp/den.cvc)*1000).toFixed(2)) : 0, target: TARGETS.IADP, case: c.iadp, dn: den.cvc },
                    { name: 'VAP (‰)', rate: den.vent>0 ? Number(((c.vap/den.vent)*1000).toFixed(2)) : 0, target: TARGETS.VAP, case: c.vap, dn: den.vent },
                    { name: 'Plebitis (‰)', rate: den.iv>0 ? Number(((c.pleb/den.iv)*1000).toFixed(2)) : 0, target: TARGETS.PLEBITIS, case: c.pleb, dn: den.iv },
                    { name: 'IDO (%)', rate: den.op>0 ? Number(((c.ido/den.op)*100).toFixed(2)) : 0, target: TARGETS.IDO, case: c.ido, dn: den.op },
                ];

                // Bundle calculations
                let bundleBreakdown = { CAUTI: { y: 0, t: 0 }, CLABSI: { y: 0, t: 0 }, VAP: { y: 0, t: 0 }, IDO: { y: 0, t: 0 } };
                let tComp=0, cntAud=0;
                
                const processA = (arr, type) => arr.forEach(r => { 
                    const keys = Object.keys(r.answers).filter(k => r.answers[k] === 'Y' || r.answers[k] === 'T');
                    if(keys.length > 0){ 
                        let score = Math.round((keys.filter(k => r.answers[k] === 'Y').length / keys.length) * 100);
                        tComp += score; 
                        cntAud++; 
                        keys.forEach(k => {
                            if(r.answers[k] === 'Y') bundleBreakdown[type].y++;
                            if(r.answers[k] === 'T') bundleBreakdown[type].t++;
                        });
                    } 
                });
                
                vAud.forEach(a => { 
                    processA(a.data.CAUTI||[], 'CAUTI'); 
                    processA(a.data.CLABSI||[], 'CLABSI'); 
                    processA(a.data.VAP||[], 'VAP'); 
                    processA(a.data.IDO||[], 'IDO'); 
                });

                const bChartData = Object.keys(bundleBreakdown).map(k => {
                    const total = bundleBreakdown[k].y + bundleBreakdown[k].t;
                    return { name: k, kepatuhan: total > 0 ? Math.round((bundleBreakdown[k].y / total) * 100) : 0 };
                });

                // Kewaspadaan calculations
                const vKewas = kewaspadaan ? kewaspadaan.filter(k => k.status === 'VERIFIED' && k.metadata.tanggal.startsWith(filterMonth) && (filterUnit === 'ALL' || k.metadata.unit === filterUnit)) : [];
                let tKewasY = 0, tKewasTotal = 0;
                let kewasBreakdown = {};

                vKewas.forEach(k => {
                    let y = 0, t = 0;
                    if (k.auditType === 'HH') {
                        k.data.forEach(r => {
                            ['m1','m2','m3','m4','m5'].forEach(m => { if (r[m] === 'Y') y++; if (r[m] === 'T') t++; });
                        });
                    } else {
                        Object.values(k.data).forEach(ans => { if (ans === 'Y') y++; if (ans === 'T') t++; });
                    }
                    
                    tKewasY += y; tKewasTotal += (y + t);
                    if(!kewasBreakdown[k.auditType]) kewasBreakdown[k.auditType] = {y:0, t:0, name: KEWASPADAAN_CONFIG[k.auditType]?.title || k.auditType};
                    kewasBreakdown[k.auditType].y += y;
                    kewasBreakdown[k.auditType].t += t;
                });

                const kwChartData = Object.values(kewasBreakdown).map(v => ({
                    name: v.name.substring(0, 15) + (v.name.length > 15 ? '...' : ''), 
                    full_name: v.name,
                    kepatuhan: (v.y + v.t) > 0 ? Math.round((v.y / (v.y + v.t)) * 100) : 0
                }));

                return { 
                    rateData: rData, 
                    kewasChartData: kwChartData, 
                    bundleChartData: bChartData,
                    kpi: { 
                        cases: c.isk+c.iadp+c.vap+c.pleb+c.ido, 
                        avgComp: cntAud>0 ? Math.round(tComp/cntAud) : 0, 
                        avgKewas: tKewasTotal>0 ? Math.round((tKewasY/tKewasTotal)*100) : 0,
                        noDen: (den.kat+den.cvc+den.vent+den.iv+den.op === 0) 
                    } 
                };
            }, [audits, surveilans, denominators, kewaspadaan, filterMonth, filterUnit]);

            return (
                <div className="space-y-6">
                    <div className="flex flex-col md:flex-row justify-between mb-4 gap-4">
                        <div>
                            <h2 className="text-2xl font-bold text-slate-800">Dashboard Mutu PPI</h2>

                        </div>
                        <div className="flex space-x-2 bg-white p-1 rounded-lg border shadow-sm items-center h-fit">
                            <i className="fa-solid fa-filter text-slate-400 ml-2"></i>
                            <input type="month" value={filterMonth} onChange={e=>setFilterMonth(e.target.value)} className="border-none bg-slate-50 px-2 py-1 rounded text-sm font-bold outline-none text-slate-700" />
                            <select value={filterUnit} onChange={e=>setFilterUnit(e.target.value)} className="border-none bg-slate-50 px-2 py-1 rounded text-sm font-bold outline-none text-slate-700">
                                <option value="ALL">Semua Unit</option>
                                {units.map(u => <option key={u} value={u}>{u}</option>)}
                            </select>
                        </div>
                    </div>

                    {kpi.noDen && (
                        <div className="bg-amber-50 border border-amber-200 p-4 rounded-xl flex items-start text-amber-800 shadow-sm animate-pulse">
                            <i className="fa-solid fa-circle-exclamation text-xl mr-3 shrink-0 mt-0.5"></i>
                            <div>
                                <h4 className="font-bold text-sm">Peringatan: Data Denominator (Hari Alat) Periode Ini Belum Tersedia</h4>
                                <p className="text-xs mt-1">Sistem mendeteksi bahwa total hari terpasang alat (pembagi) adalah 0 pada periode/unit yang dipilih. <b>Tingkat Insiden / Rate (‰) tidak dapat dihitung dengan benar jika nilai pembagi kosong.</b> Harap tugaskan IPCLN untuk menginput Denominator akhir bulan melalui menu Denominator.</p>
                            </div>

                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div className="bg-white border border-slate-200 p-5 rounded-xl shadow-sm">
                            <p className="text-xs font-bold text-slate-500 uppercase">Avg Kepatuhan Bundle</p>

                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 mt-6">

            const [statusMsg, setStatusMsg] = useState(null);

            useEffect(() => {
                if (editPayload) {
                    setMetadata(editPayload.metadata);
                    setBundleRows(editPayload.data);
                }
            }, [editPayload]);

            const handleSave = () => {
                if (!metadata.unit) {
                    setStatusMsg({ type: 'error', text: 'Pilih Unit Terlebih Dahulu!' });
                    setTimeout(() => setStatusMsg(null), 3000);
                    return;
                }
                onSave({ 
                    id: editPayload ? editPayload.id : Date.now(), 
                    status: editPayload ? editPayload.status : (user.role === 'IPCLN' ? 'DRAFT' : 'VERIFIED'), 
                    metadata, data: bundleRows 
                });
                setBundleRows({ CAUTI: [], CLABSI: [], VAP: [], IDO: [] });
                setStatusMsg({ type: 'success', text: user.role === 'IPCLN' && !editPayload ? 'Audit Dikirim sebagai Draft!' : 'Data Audit Berhasil Disimpan!' });
                setTimeout(() => setStatusMsg(null), 3000);
            };

            return (

                            {statusMsg && <span className={`text-sm px-3 py-1 rounded-full font-medium border ${statusMsg.type === 'success' ? 'text-green-600 bg-green-50 border-green-200' : 'text-red-600 bg-red-50 border-red-200'}`}>{statusMsg.text}</span>}

                            <div><label className="block text-xs font-bold text-slate-500 uppercase">Tgl Audit</label><input type="date" className="mt-1 w-full border border-slate-300 rounded p-2 text-sm outline-none bg-white" value={metadata.tanggal} onChange={(e) => setMetadata({...metadata, tanggal: e.target.value})} /></div>
                            <div><label className="block text-xs font-bold text-slate-500 uppercase">Unit</label><select className="mt-1 w-full border border-slate-300 rounded p-2 text-sm bg-white outline-none" value={metadata.unit} onChange={(e) => setMetadata({...metadata, unit: e.target.value})} disabled={user.unit!=='ALL'}><option value="">Pilih...</option>{(user.unit==='ALL'?masterUnits:[user.unit]).map(u => <option key={u} value={u}>{u}</option>)}</select></div>

                                        {config.columns.map(c => (

                                                    <button onClick={()=>setAns(r.id,c.key,'Y')} className={`px-2 py-1 border rounded text-xs font-bold ${r.answers[c.key]==='Y'?'bg-green-500 text-white border-green-600':'bg-white text-slate-400'}`}>Y</button>

                                                    <button onClick={()=>setAns(r.id,c.key,'NA')} className={`text-[10px] px-1 ${r.answers[c.key]==='NA'?'font-bold text-slate-800 underline':'text-slate-400'}`}>N/A</button>
                                                </div>
                                            </td>
                                        ))}
                                        <td className="p-2 text-center font-bold text-slate-700 bg-slate-50">{calculateCompliance(r.answers)}%</td>
                                        <td className="p-2 text-center"><button onClick={()=>setRows(rows.filter(x=>x.id!==r.id))} className="text-red-400"><i className="fa-solid fa-trash"></i></button></td>

                        </table>
                    </div>
                    <button onClick={addRow} className="mt-3 text-sm font-bold text-teal-700 bg-teal-50 px-3 py-2 rounded-lg flex items-center border border-teal-200 hover:bg-teal-100"><i className="fa-solid fa-plus mr-2"></i>Tambah Pasien</button>
                </div>
            );
        }

                if (editPayload) {

                    setActiveAudit(editPayload.auditType);
                    if (editPayload.auditType === 'HH') setHhRows(editPayload.data);
                    else setChecklistData(editPayload.data);
                }
            }, [editPayload]);

            const handleSave = () => {
                if (!metadata.unit) {
                    setStatusMsg({ type: 'error', text: 'Pilih Unit Terlebih Dahulu!' });
                    setTimeout(() => setStatusMsg(null), 3000);
                    return;
                }
                
                let dataToSave = null;
                const config = KEWASPADAAN_CONFIG[activeAudit];

                        setStatusMsg({ type: 'error', text: 'Belum ada data observasi!' });
                        setTimeout(() => setStatusMsg(null), 3000);
                        return;
                    }
                    dataToSave = hhRows;

                    if (Object.keys(checklistData).length === 0) {
                        setStatusMsg({ type: 'error', text: 'Belum ada data observasi!' });
                        setTimeout(() => setStatusMsg(null), 3000);
                        return;
                    }
                    dataToSave = checklistData;
                }

                onSave({

                });
                setHhRows([]);
                setChecklistData({});
                setStatusMsg({ type: 'success', text: user.role === 'IPCLN' ? 'Audit Dikirim sebagai Draft!' : 'Data Audit Tersimpan!' });
                setTimeout(() => setStatusMsg(null), 3000);
            };

            const renderHH = () => {

                                        <th className="p-2 text-center text-xs font-bold" title="Setelah Risiko Cairan">M3</th>
                                        <th className="p-2 text-center text-xs font-bold" title="Setelah Sentuh Pasien">M4</th>
                                        <th className="p-2 text-center text-xs font-bold" title="Setelah Sentuh Lingkungan">M5</th>
                                        <th className="p-2 text-center text-xs font-bold">Metode</th>

            const renderChecklist = () => {
                const config = KEWASPADAAN_CONFIG[activeAudit];
                const setAns = (itemIndex, v) => setChecklistData({ ...checklistData, [itemIndex]: v });
                let globalIndex = 0;

                return (
                    <div className="mt-4 space-y-6">
                        {config.sections.map((sec, sIdx) => (
                            <div key={sIdx} className="border border-slate-200 rounded-lg overflow-hidden">

                                <ul className="divide-y divide-slate-100 bg-white">
                                    {sec.items.map((item) => {
                                        const idx = globalIndex++;
                                        return (
                                            <li key={idx} className="p-3 flex flex-col md:flex-row md:items-center justify-between hover:bg-slate-50 transition">
                                                <span className="text-sm text-slate-700 mb-2 md:mb-0 md:mr-4 flex-1">{item}</span>
                                                <div className="flex space-x-2 shrink-0">
                                                    <button onClick={()=>setAns(idx, 'Y')} className={`px-3 py-1.5 border rounded text-xs font-bold ${checklistData[idx]==='Y'?'bg-green-500 text-white border-green-600':'bg-white text-slate-400 hover:bg-slate-50'}`}>Ya</button>
                                                    <button onClick={()=>setAns(idx, 'T')} className={`px-3 py-1.5 border rounded text-xs font-bold ${checklistData[idx]==='T'?'bg-red-500 text-white border-red-600':'bg-white text-slate-400 hover:bg-slate-50'}`}>Tidak</button>
                                                    <button onClick={()=>setAns(idx, 'NA')} className={`px-3 py-1.5 border rounded text-xs font-bold ${checklistData[idx]==='NA'?'bg-slate-500 text-white border-slate-600':'bg-white text-slate-400 hover:bg-slate-50'}`}>N/A</button>

                            </div>

                    </div>
                );
            };

            return (
                <div className="space-y-6">
                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <div className="flex justify-between items-center mb-4">
                            <h2 className="text-lg font-bold text-slate-800 flex items-center"><i className="fa-solid fa-list-check text-teal-600 mr-2"></i> Audit Kewaspadaan Standar</h2>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6 p-4 bg-slate-50 rounded-lg border border-slate-100">
                            <div><label className="block text-xs font-bold text-slate-500 uppercase">Tgl Audit</label><input type="date" className="mt-1 w-full border border-slate-300 rounded p-2 text-sm outline-none bg-white" value={metadata.tanggal} onChange={(e) => setMetadata({...metadata, tanggal: e.target.value})} /></div>
                            <div><label className="block text-xs font-bold text-slate-500 uppercase">Unit</label><select className="mt-1 w-full border border-slate-300 rounded p-2 text-sm bg-white outline-none" value={metadata.unit} onChange={(e) => setMetadata({...metadata, unit: e.target.value})} disabled={user.unit!=='ALL'}><option value="">Pilih...</option>{(user.unit==='ALL'?masterUnits:[user.unit]).map(u => <option key={u} value={u}>{u}</option>)}</select></div>

                        </div>
                        
                        <div className="mb-4">
                            <label className="block text-sm font-bold text-slate-700 mb-2">Kategori Kewaspadaan Standar:</label>
                            <div className="flex flex-wrap gap-2">
                                {Object.keys(KEWASPADAAN_CONFIG).map(k => (
                                    <button key={k} onClick={()=>{setActiveAudit(k); setHhRows([]); setChecklistData({});}} className={`px-4 py-2 rounded-lg text-sm font-bold transition-colors ${activeAudit === k ? 'bg-purple-600 text-white shadow-md' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>

                    </div>

        }

        function SurveilansModule({ onSave, user, masterUnits, editPayload }) {
            const [activeType, setActiveType] = useState('ISK');
            const [saveStatus, setSaveStatus] = useState({ status: false, msg: ''});
            const SURV_TYPES = Object.keys(SURVEILANS_CONFIG);

            const [metadata, setMetadata] = useState({
                bulan: new Date().toISOString().slice(0,7),
                unit: user.unit !== 'ALL' ? user.unit : '',
                ipcln: user.name, tglPengisian: new Date().toISOString().split('T')[0]
            });

            const [survData, setSurvData] = useState({ IDO: [], ISK: [], IADP: [], VAP: [], PLEBITIS: [] });
            
            useEffect(() => {
                if (editPayload) {
                    setMetadata(editPayload.metadata);
                    setSurvData(editPayload.data);
                }
            }, [editPayload]);

            const handleDataChange = (type, newRows) => setSurvData(prev => ({ ...prev, [type]: newRows }));

            const availableUnits = user.unit === 'ALL' ? masterUnits : [user.unit];

            const handleSave = () => {
                if (!metadata.bulan || !metadata.unit) {
                    setSaveStatus({status: 'error', msg: 'Harap isi Periode (Bulan) dan Unit Ruangan!'});
                    setTimeout(() => setSaveStatus({status:false}), 3000);
                    return;
                }
                const payload = {
                    id: editPayload ? editPayload.id : Date.now(), 
                    status: editPayload ? editPayload.status : (user.role === 'IPCLN' ? 'DRAFT' : 'VERIFIED'),
                    metadata, data: survData
                };
                onSave(payload);
                setSurvData({ IDO: [], ISK: [], IADP: [], VAP: [], PLEBITIS: [] });
                setSaveStatus({status: 'success', msg: user.role === 'IPCLN' && !editPayload ? 'Draft Berhasil Dikirim ke IPCN!' : 'Data Surveilans Tersimpan!'});
                setTimeout(() => setSaveStatus({status:false}), 3000);
            };

            return (
                <div className="space-y-6">
                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <div className="flex justify-between items-center mb-4">
                            <h2 className="text-lg font-bold text-slate-800 flex items-center">
                                <i className="fa-solid fa-chart-line text-teal-600 mr-2"></i> Pencatatan Surveilans Kasus HAIs
                            </h2>
                            {saveStatus.status === 'success' && <span className="text-sm text-green-600 bg-green-50 px-3 py-1 rounded-full font-medium border border-green-200">{saveStatus.msg}</span>}
                            {saveStatus.status === 'error' && <span className="text-sm text-red-600 bg-red-50 px-3 py-1 rounded-full font-medium border border-red-200">{saveStatus.msg}</span>}
                        </div>
                        
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6 p-4 bg-slate-50 rounded-lg border border-slate-100">
                            <div><label className="block text-xs font-bold text-slate-500 uppercase">Periode (Bulan)</label><input type="month" className="mt-1 w-full border border-slate-300 rounded p-2 text-sm outline-none bg-white" value={metadata.bulan} onChange={(e) => setMetadata({...metadata, bulan: e.target.value})} /></div>
                            <div><label className="block text-xs font-bold text-slate-500 uppercase">Unit / Ruangan</label><select className="mt-1 w-full border border-slate-300 rounded p-2 text-sm outline-none bg-white" value={metadata.unit} onChange={(e) => setMetadata({...metadata, unit: e.target.value})} disabled={user.unit !== 'ALL'}><option value="">Pilih Unit...</option>{availableUnits.map(u => <option key={u} value={u}>{u}</option>)}</select></div>
                            <div><label className="block text-xs font-bold text-slate-500 uppercase">Petugas (IPCLN)</label><input type="text" className="mt-1 w-full bg-slate-100 border border-slate-300 rounded p-2 text-sm outline-none" value={metadata.ipcln} disabled /></div>
                        </div>

                        <div className="flex flex-wrap gap-2 mb-6 border-b border-slate-200 pb-4">
                            {SURV_TYPES.map((type) => (
                                <button key={type} onClick={() => setActiveType(type)}
                                    className={`px-4 py-2 rounded-full text-sm font-bold transition-colors flex items-center ${activeType === type ? 'bg-teal-600 text-white shadow-md' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>
                                    {type}
                                    {survData[type].length > 0 && <span className={`ml-2 py-0.5 px-2 rounded-full text-[10px] ${activeType === type ? 'bg-teal-800 text-white' : 'bg-slate-300 text-slate-700'}`}>{survData[type].length}</span>}
                                </button>
                            ))}
                        </div>

                        <div className="mb-6">
                            <div className="bg-blue-50 text-blue-900 p-4 rounded-md text-sm border border-blue-200 mb-4 flex items-start">
                                <i className="fa-solid fa-circle-info mr-3 mt-1 text-blue-600 shrink-0 text-lg"></i>
                                <div>
                                    <p className="font-bold mb-1">Definisi {activeType}:</p>
                                    <p className="mb-3 leading-relaxed text-xs">{SURVEILANS_CONFIG[activeType].def}</p>
                                    <p className="font-bold mb-1">Kriteria Surveilans:</p>
                                    <ul className="list-none space-y-1">
                                        {SURVEILANS_CONFIG[activeType].kriteria.map((krit, idx) => (
                                            <li key={idx} className="text-xs leading-relaxed text-blue-800">{krit}</li>
                                        ))}
                                    </ul>
                                </div>
                            </div>
                            <SurveilansSpecificTable config={SURVEILANS_CONFIG[activeType].cols} rows={survData[activeType]} setRows={(r) => handleDataChange(activeType, r)} />
                        </div>

                        <div className="mt-8 pt-4 border-t border-slate-200 flex justify-end items-center">
                            <button onClick={handleSave} className={`flex items-center px-8 py-3 text-white rounded-lg shadow-md font-bold transition ${user.role==='IPCLN' ? 'bg-amber-500 hover:bg-amber-600' : 'bg-teal-600 hover:bg-teal-700'}`}>
                                <i className="fa-solid fa-floppy-disk mr-2"></i> {user.role === 'IPCLN' ? 'Kirim ke IPCN (Draft)' : 'Simpan Data Surveilans'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function SurveilansSpecificTable({ config, rows, setRows }) {
            const addRow = () => {
                let emptyRow = { id: Date.now(), pasien: '', nrm: '' };
                config.forEach(c => emptyRow[c.k] = '');
                setRows([...rows, emptyRow]);
            };
            const removeRow = (id) => setRows(rows.filter(r => r.id !== id));
            const updateVal = (id, key, val) => setRows(rows.map(r => r.id === id ? {...r, [key]: val} : r));

            return (
                <div className="space-y-3">
                    <div className="overflow-x-auto rounded-lg border border-slate-200">
                        <table className="min-w-full divide-y divide-slate-200 text-sm whitespace-nowrap">
                            <thead className="bg-slate-50">
                                <tr>
                                    <th className="px-3 py-3 text-left font-semibold text-slate-700">Pasien & NRM</th>
                                    {config.map(c => <th key={c.k} className="px-3 py-3 text-left font-semibold text-slate-700">{c.l}</th>)}
                                    <th className="px-2 py-3 w-10"></th>
                                </tr>
                            </thead>
                            <tbody className="bg-white divide-y divide-slate-200">
                                {rows.length === 0 && (<tr><td colSpan={config.length + 2} className="px-4 py-8 text-center text-slate-400 italic">Belum ada input kasus. Klik "Tambah Data Pasien" untuk mulai pendataan.</td></tr>)}
                                {rows.map((row) => (
                                    <tr key={row.id} className="hover:bg-slate-50">
                                        <td className="px-3 py-2 align-top">
                                            <input type="text" placeholder="Nama Pasien" value={row.pasien} onChange={e=>updateVal(row.id,'pasien',e.target.value)} className="w-40 mb-1 p-1.5 border border-slate-300 rounded block text-xs outline-none focus:border-teal-500 bg-white" />
                                            <input type="text" placeholder="No RM" value={row.nrm} onChange={e=>updateVal(row.id,'nrm',e.target.value)} className="w-40 p-1.5 border border-slate-300 rounded block text-xs bg-slate-50 outline-none focus:border-teal-500" />
                                        </td>
                                        {config.map(c => (
                                            <td key={c.k} className="px-3 py-2 align-top">
                                                {c.t === 'select' ? (
                                                    <select value={row[c.k]} onChange={e=>updateVal(row.id, c.k, e.target.value)} className="p-1.5 border border-slate-300 rounded text-xs outline-none focus:border-teal-500 bg-white min-w-[120px]">
                                                        <option value="">- Pilih -</option>
                                                        {c.opts.map(o => <option key={o} value={o}>{o}</option>)}
                                                    </select>
                                                ) : (
                                                    <input type={c.t} value={row[c.k]} onChange={e=>updateVal(row.id, c.k, e.target.value)} placeholder="..." className="w-full p-1.5 border border-slate-300 rounded text-xs outline-none focus:border-teal-500 bg-white" />
                                                )}
                                            </td>
                                        ))}
                                        <td className="px-2 py-2 align-middle text-center"><button onClick={() => removeRow(row.id)} className="text-red-400 hover:text-red-600 hover:bg-red-50 p-1.5 rounded transition"><i className="fa-solid fa-trash"></i></button></td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                    <button onClick={addRow} className="text-sm font-bold text-teal-700 bg-teal-50 hover:bg-teal-100 px-3 py-2 rounded-lg flex items-center transition border border-teal-200"><i className="fa-solid fa-plus mr-2"></i> Tambah Data Pasien</button>
                </div>
            );
        }

        function DenominatorModule({ denominators, setDenominators, user, masterUnits, editPayload, clearEdit }) {
            const [form, setForm] = useState({ bulan: new Date().toISOString().slice(0,7), unit: user.unit !== 'ALL' ? user.unit : '', hariRawat: '', hariKateter: '', hariCVC: '', hariVentilator: '', hariIVLine: '', jumlahOperasi: '' });
            const [msg, setMsg] = useState({ text: '', type: '' });
            const availableUnits = user.unit === 'ALL' ? masterUnits : [user.unit];

            useEffect(() => {
                if (editPayload) setForm(editPayload);
            }, [editPayload]);

            const handleSave = () => {
                if (!form.bulan || !form.unit) { 
                    setMsg({text: 'Bulan dan Unit Wajib diisi!', type: 'error'}); 
                    setTimeout(() => setMsg({text: '', type: ''}), 3000);
                    return; 
                }
                const payload = {
                    ...form, id: editPayload ? editPayload.id : Date.now(),
                    hariRawat: Number(form.hariRawat)||0, hariKateter: Number(form.hariKateter)||0, 
                    hariCVC: Number(form.hariCVC)||0, hariVentilator: Number(form.hariVentilator)||0, 
                    hariIVLine: Number(form.hariIVLine)||0, jumlahOperasi: Number(form.jumlahOperasi)||0
                };
                
                const filtered = denominators.filter(d => !(d.bulan === form.bulan && d.unit === form.unit && d.id !== payload.id));
                setDenominators([...filtered, payload]);
                
                setMsg({text: editPayload ? 'Data Denominator Diperbarui!' : 'Data Denominator Berhasil Disimpan!', type: 'success'});
                setTimeout(() => { 
                    setMsg({text: '', type: ''}); 
                    if(clearEdit) clearEdit();
                }, 1500);
            };

            return (
                <div className="space-y-6">
                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <h2 className="text-lg font-bold text-slate-800 mb-2 flex items-center">
                            <i className="fa-solid fa-database text-teal-600 mr-2"></i> Form Input Denominator 
                        </h2>
                        <p className="text-sm text-slate-500 mb-6">Wajib diisi setiap akhir bulan oleh IPCLN sebagai pembagi (denominator) dalam perhitungan Incidence Rate (‰).</p>
                        
                        {msg.text && (
                            <div className={`mb-4 p-3 rounded-lg text-sm font-bold border ${msg.type === 'error' ? 'bg-red-50 text-red-700 border-red-200' : 'bg-teal-50 text-teal-700 border-teal-200'}`}>
                                {msg.text}
                            </div>
                        )}

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 bg-slate-50 p-5 rounded-lg border border-slate-100 mb-6">
                            <div>
                                <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Periode (Bulan/Tahun)</label>
                                <input type="month" value={form.bulan} onChange={e => setForm({...form, bulan: e.target.value})} className="w-full border border-slate-300 rounded-md p-2 text-sm outline-none focus:ring-2 focus:ring-teal-500" />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Unit Ruangan</label>
                                <select value={form.unit} onChange={e => setForm({...form, unit: e.target.value})} disabled={user.unit !== 'ALL'} className="w-full border border-slate-300 rounded-md p-2 text-sm bg-white disabled:bg-slate-100 outline-none">
                                    <option value="">Pilih Unit...</option>
                                    {availableUnits.map(u => <option key={u} value={u}>{u}</option>)}
                                </select>
                            </div>
                        </div>

                        <div className="grid grid-cols-2 md:grid-cols-3 gap-4 mb-6">
                            {[
                                {k:'hariRawat', l:'Total Hari Rawat', c:'bg-slate-100'}, {k:'hariKateter', l:'Total Hari Kateter (ISK)', c:'bg-blue-50'},
                                {k:'hariCVC', l:'Total Hari CVC (IADP)', c:'bg-indigo-50'}, {k:'hariVentilator', l:'Total Hari Ventilator (VAP)', c:'bg-purple-50'},
                                {k:'hariIVLine', l:'Total Hari IV Line (Plebitis)', c:'bg-orange-50'}, {k:'jumlahOperasi', l:'Total Tindakan Op (IDO)', c:'bg-yellow-50'}
                            ].map(item => (
                                <div key={item.k} className={`p-4 rounded-lg border border-slate-200 ${item.c}`}>
                                    <label className="block text-xs font-semibold text-slate-700 mb-2">{item.l}</label>
                                    <input type="number" min="0" value={form[item.k]} onChange={e => setForm({...form, [item.k]: e.target.value})} className="w-full border border-slate-300 rounded-md p-2 text-lg font-bold text-center outline-none focus:ring-2 focus:ring-teal-500" placeholder="0" />
                                </div>
                            ))}
                        </div>
                        <div className="flex justify-end">
                            <button onClick={handleSave} className="flex items-center px-6 py-3 bg-teal-600 text-white rounded-lg hover:bg-teal-700 shadow-md font-bold transition">
                                <i className="fa-solid fa-floppy-disk mr-2"></i> {editPayload ? 'Perbarui Denominator' : 'Simpan Denominator'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function VerifikasiModule({ audits, surveilans, kewaspadaan, setAudits, setSurveilans, setKewaspadaan }) {
            const [preview, setPreview] = useState(null);

            const verify = (id, type) => {
                if(type==='A') setAudits(audits.map(a => a.id === id ? {...a, status: 'VERIFIED'} : a));
                if(type==='S') setSurveilans(surveilans.map(s => s.id === id ? {...s, status: 'VERIFIED'} : s));
                if(type==='K') setKewaspadaan(kewaspadaan.map(k => k.id === id ? {...k, status: 'VERIFIED'} : k));
                setPreview(null);
            };
            
            const dAud = audits.filter(a => a.status === 'DRAFT');
            const dSurv = surveilans.filter(s => s.status === 'DRAFT');
            const dKewas = kewaspadaan.filter(k => k.status === 'DRAFT');

            const renderPreviewModal = () => {
                if (!preview) return null;
                const { item, type } = preview;
                
                return (
                    <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                        <div className="bg-white rounded-xl shadow-2xl w-full max-w-3xl max-h-[90vh] flex flex-col overflow-hidden animate-fade-in">
                            <div className="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                                <h3 className="font-bold text-slate-800 text-lg flex items-center">
                                    <i className="fa-solid fa-magnifying-glass text-teal-600 mr-2"></i> Preview Data {type}
                                </h3>
                                <button onClick={() => setPreview(null)} className="text-slate-400 hover:text-red-500 transition text-xl"><i className="fa-solid fa-times"></i></button>

                e.preventDefault();
                if(uName && uPass) {

                        setUsers(users.map(u => u.id === editUserId ? { ...u, name: uName, role: uRole, unit: uRole === 'IPCLN' ? uUnit : 'ALL', password: uPass } : u));

                    } else {
                        setUsers([...users, { id: Date.now(), name: uName, role: uRole, unit: uRole === 'IPCLN' ? uUnit : 'ALL', password: uPass }]);
                    }
                    setUName(''); setUPass(''); setUUnit(''); setURole('IPCLN');
                }

                setEditUserId(user.id);
                setUName(user.name);
                setURole(user.role);
                setUUnit(user.unit === 'ALL' ? '' : user.unit);
                setUPass(user.password);
            };

            const handleCancelEdit = () => {
                setEditUserId(null);
                setUName(''); setUPass(''); setUUnit(''); setURole('IPCLN');
            };

            const handleAddUnit = (e) => {
                e.preventDefault();

                    setNewUnit('');
                }

                                    </div>}
                                    <div><label className="text-xs font-semibold">Password</label><input type="text" required value={uPass} onChange={e=>setUPass(e.target.value)} className="w-full mt-1 border border-slate-300 rounded p-2 text-sm outline-none focus:border-teal-500 bg-white" /></div>
                                    <div className="flex space-x-2 mt-4">
                                        <button type="submit" className="flex-1 bg-teal-600 text-white font-bold py-2 rounded text-sm hover:bg-teal-700 transition shadow-sm"><i className={`fa-solid ${editUserId ? 'fa-save' : 'fa-plus'} mr-1`}></i> {editUserId ? 'Simpan' : 'Tambah'}</button>
                                        {editUserId && <button type="button" onClick={handleCancelEdit} className="flex-1 bg-slate-300 text-slate-700 font-bold py-2 rounded text-sm hover:bg-slate-400 transition shadow-sm"><i className="fa-solid fa-times mr-1"></i> Batal</button>}
                                    </div>
                                </form>
                            </div>
                            <div className="md:col-span-2 overflow-x-auto">
                                <table className="w-full text-sm text-left border-collapse border border-slate-200 rounded-lg">
                                    <thead className="bg-slate-50 text-slate-600 border-b"><tr><th className="p-3">Nama</th><th className="p-3">Role</th><th className="p-3">Unit</th><th className="p-3">Password</th><th className="p-3 text-center">Aksi</th></tr></thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {users.map(u => (
                                            <tr key={u.id} className="hover:bg-slate-50">
                                                <td className="p-3 font-medium">{u.name}</td><td className="p-3"><span className="bg-slate-200 px-2 py-1 rounded text-xs">{u.role}</span></td>
                                                <td className="p-3">{u.unit}</td><td className="p-3 text-slate-400">••••{u.password.slice(-2)}</td>
                                                <td className="p-3 text-center space-x-2">
                                                    <button onClick={() => handleEditClick(u)} className="text-blue-500 hover:bg-blue-50 p-1 rounded transition" title="Edit User"><i className="fa-solid fa-pen-to-square"></i></button>
                                                    <button onClick={() => {if(window.confirm('Hapus pengguna ini?')) deleteUser(u.id, users.filter(x=>x.id!==u.id))}} className="text-red-500 hover:bg-red-50 p-1 rounded transition" title="Hapus User"><i className="fa-solid fa-trash"></i></button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                    {activeTab === 'units' && (
                        <div className="max-w-md">
                            <form onSubmit={handleAddUnit} className="flex space-x-2 mb-6">
                                <input type="text" required value={newUnit} onChange={e=>setNewUnit(e.target.value)} placeholder="Nama Unit (Mis: IGD, NICU)..." className="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-teal-500" />
                                <button type="submit" className="bg-teal-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-teal-700 shadow-sm">Tambah</button>
                            </form>
                            <ul className="border border-slate-200 rounded-lg divide-y divide-slate-200">
                                {units.map(u => (
                                    <li key={u.id} className="flex justify-between items-center p-3 text-sm hover:bg-slate-50">
                                        <span className="font-medium text-slate-700">{u.name}</span>
                                        <button onClick={() => {if(window.confirm('Hapus unit ini?')) deleteUnit(u.id, units.filter(x=>x.id!==u.id))}} className="text-red-500 hover:bg-red-50 p-1 rounded transition"><i className="fa-solid fa-trash"></i></button>
                                    </li>
                                ))}
                            </ul>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<HAIsApp />);
    </script>
</body>
</html>
