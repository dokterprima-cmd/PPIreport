            }

        function useAppDatabase(collectionName, initialData) {
            const [data, setData] = useState(initialData);

            useEffect(() => {
                if (isFirebaseConfigured && db) {
                    const unsub = db.collection(collectionName).onSnapshot((snapshot) => {
                        const items = [];
                        snapshot.forEach((doc) => items.push({ id: doc.id, ...doc.data() }));
                        setData(items.length > 0 ? items : initialData);
                    });
                    return () => unsub();
                } else {
                    try {
                        const item = window.localStorage.getItem(`ppi_${collectionName}`);
                        if (item) setData(JSON.parse(item));
                    } catch (error) {
                        console.error(error);
                    }
                }
            }, [collectionName]);

            const saveData = async (newDataArray) => {
                if (isFirebaseConfigured && db) {
                   for (const item of newDataArray) {
                       await db.collection(collectionName).doc(String(item.id)).set(item);
                   }
                } else {
                   setData(newDataArray);
                   window.localStorage.setItem(`ppi_${collectionName}`, JSON.stringify(newDataArray));
                }
            };

            const deleteItem = async (id, updatedArray) => {
                if (isFirebaseConfigured && db) {
                    await db.collection(collectionName).doc(String(id)).delete();
                } else {
                    setData(updatedArray);
                    window.localStorage.setItem(`ppi_${collectionName}`, JSON.stringify(updatedArray));
                }
            }

            return [data, saveData, deleteItem];
        }

        function DenominatorModule({ denominators, setDenominators, user, masterUnits }) {

            const availableUnits = user.unit === 'ALL' ? masterUnits : [user.unit];

            const handleSave = () => {
                if (!form.bulan || !form.unit) { 
                    setMsg({text: 'Bulan dan Unit Wajib diisi!', type: 'error'}); 
                    setTimeout(() => setMsg({text: '', type: ''}), 3000);
                    return; 
                }
                const payload = {
                    ...form, id: Date.now(),
                    hariRawat: Number(form.hariRawat)||0, hariKateter: Number(form.hariKateter)||0, 
                    hariCVC: Number(form.hariCVC)||0, hariVentilator: Number(form.hariVentilator)||0, 
                    hariIVLine: Number(form.hariIVLine)||0, jumlahOperasi: Number(form.jumlahOperasi)||0
                };
                
                const filtered = denominators.filter(d => !(d.bulan === form.bulan && d.unit === form.unit));
                setDenominators([...filtered, payload]);
                
                setMsg({text: 'Data Denominator Berhasil Disimpan!', type: 'success'});
                setTimeout(() => setMsg({text: '', type: ''}), 3000);

                            {[
                                {k:'hariRawat', l:'Total Hari Rawat', c:'bg-slate-100'}, {k:'hariKateter', l:'Total Hari Kateter (ISK)', c:'bg-blue-50'},
                                {k:'hariCVC', l:'Total Hari CVC (IADP)', c:'bg-indigo-50'}, {k:'hariVentilator', l:'Total Hari Ventilator (VAP)', c:'bg-purple-50'},
                                {k:'hariIVLine', l:'Total Hari IV Line (Plebitis)', c:'bg-orange-50'}, {k:'jumlahOperasi', l:'Total Tindakan Op (IDO)', c:'bg-yellow-50'}

                                <i className="fa-solid fa-floppy-disk mr-2"></i> Simpan Denominator

        function SurveilansModule({ onSave, user, masterUnits }) {
            const [activeType, setActiveType] = useState('ISK');
            const [saveStatus, setSaveStatus] = useState({ status: false, msg: ''});
            const SURV_TYPES = Object.keys(SURVEILANS_CONFIG);

            const [metadata, setMetadata] = useState({
                bulan: new Date().toISOString().slice(0,7),
                unit: user.unit !== 'ALL' ? user.unit : '',
                ipcln: user.name, tglPengisian: new Date().toISOString().split('T')[0]
            });

            const [survData, setSurvData] = useState({ IDO: [], ISK: [], IADP: [], VAP: [], PLEBITIS: [] });

            const handleSave = () => {
                if (!metadata.bulan || !metadata.unit) {
                    setSaveStatus({status: 'error', msg: 'Harap isi Periode (Bulan) dan Unit Ruangan!'});
                    setTimeout(() => setSaveStatus({status:false}), 3000);
                    return;

                const payload = {
                    id: Date.now(), status: user.role === 'IPCLN' ? 'DRAFT' : 'VERIFIED',

                };

                setSurvData({ IDO: [], ISK: [], IADP: [], VAP: [], PLEBITIS: [] });
                setSaveStatus({status: 'success', msg: user.role === 'IPCLN' ? 'Draft Berhasil Dikirim ke IPCN!' : 'Data Surveilans Tersimpan!'});

                        <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6 p-4 bg-slate-50 rounded-lg border border-slate-100">

                            <div><label className="block text-xs font-bold text-slate-500 uppercase">Unit / Ruangan</label><select className="mt-1 w-full border border-slate-300 rounded p-2 text-sm outline-none bg-white" value={metadata.unit} onChange={(e) => setMetadata({...metadata, unit: e.target.value})} disabled={user.unit !== 'ALL'}><option value="">Pilih Unit...</option>{availableUnits.map(u => <option key={u} value={u}>{u}</option>)}</select></div>

                                </button>

                        </div>

                        <div className="mb-6">
                            <div className="bg-blue-50 text-blue-900 p-4 rounded-md text-sm border border-blue-200 mb-4 flex items-start">
                                <i className="fa-solid fa-circle-info mr-3 mt-1 text-blue-600 shrink-0 text-lg"></i>
                                <div>
                                    <p className="font-bold mb-1">Definisi {activeType}:</p>

                                    <p className="font-bold mb-1">Kriteria Surveilans:</p>
                                    <ul className="list-none space-y-1">
                                        {SURVEILANS_CONFIG[activeType].kriteria.map((krit, idx) => (

                        <div className="mt-8 pt-4 border-t border-slate-200 flex justify-end items-center">
                            <button onClick={handleSave} className={`flex items-center px-8 py-3 text-white rounded-lg shadow-md font-bold transition ${user.role==='IPCLN' ? 'bg-amber-500 hover:bg-amber-600' : 'bg-teal-600 hover:bg-teal-700'}`}>

        function SurveilansSpecificTable({ config, rows, setRows }) {
            const addRow = () => {
                let emptyRow = { id: Date.now(), pasien: '', nrm: '' };
                config.forEach(c => emptyRow[c.k] = '');
                setRows([...rows, emptyRow]);
            };
            const removeRow = (id) => setRows(rows.filter(r => r.id !== id));
            const updateVal = (id, key, val) => setRows(rows.map(r => r.id === id ? {...r, [key]: val} : r));

            return (
                <div className="space-y-3">

                                            <input type="text" placeholder="No RM" value={row.nrm} onChange={e=>updateVal(row.id,'nrm',e.target.value)} className="w-40 p-1.5 border border-slate-300 rounded block text-xs bg-slate-50 outline-none focus:border-teal-500" />
                                        </td>
                                        {config.map(c => (
                                            <td key={c.k} className="px-3 py-2 align-top">

                                                    <select value={row[c.k]} onChange={e=>updateVal(row.id, c.k, e.target.value)} className="p-1.5 border border-slate-300 rounded text-xs outline-none focus:border-teal-500 bg-white min-w-[120px]">

                                                )}

                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                    <button onClick={addRow} className="text-sm font-bold text-teal-700 bg-teal-50 hover:bg-teal-100 px-3 py-2 rounded-lg flex items-center transition border border-teal-200"><i className="fa-solid fa-plus mr-2"></i> Tambah Data Pasien</button>
                </div>
            );
        }

        const calculateCompliance = (answers) => {
            const keys = Object.keys(answers).filter(k => answers[k] === 'Y' || answers[k] === 'T');
            if (keys.length === 0) return 0;
            return Math.round((keys.filter(k => answers[k] === 'Y').length / keys.length) * 100);
        };

        function AuditModule({ onSave, user, masterUnits }) {
            const [activeBundle, setActiveBundle] = useState('CAUTI');
            const [bundleRows, setBundleRows] = useState({ CAUTI: [], CLABSI: [], VAP: [], IDO: [] });
            const [metadata, setMetadata] = useState({ tanggal: new Date().toISOString().split('T')[0], unit: user.unit !== 'ALL' ? user.unit : '', auditor: user.name });
            const [statusMsg, setStatusMsg] = useState(null);

            const handleSave = () => {
                if (!metadata.unit) {
                    setStatusMsg({ type: 'error', text: 'Pilih Unit Terlebih Dahulu!' });
                    setTimeout(() => setStatusMsg(null), 3000);
                    return;
                }
                onSave({ id: Date.now(), status: user.role === 'IPCLN' ? 'DRAFT' : 'VERIFIED', metadata, data: bundleRows });
                setBundleRows({ CAUTI: [], CLABSI: [], VAP: [], IDO: [] });
                setStatusMsg({ type: 'success', text: user.role === 'IPCLN' ? 'Audit Dikirim sebagai Draft!' : 'Data Audit Berhasil Disimpan!' });
                setTimeout(() => setStatusMsg(null), 3000);
            };

            return (
                <div className="space-y-6">
                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <div className="flex justify-between items-center mb-4">
                            <h2 className="text-lg font-bold text-slate-800 flex items-center"><i className="fa-solid fa-file-lines text-teal-600 mr-2"></i> Formulir Audit Kepatuhan Bundle</h2>
                            {statusMsg && <span className={`text-sm px-3 py-1 rounded-full font-medium border ${statusMsg.type === 'success' ? 'text-green-600 bg-green-50 border-green-200' : 'text-red-600 bg-red-50 border-red-200'}`}>{statusMsg.text}</span>}
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6 p-4 bg-slate-50 rounded-lg border border-slate-100">
                            <div><label className="block text-xs font-bold text-slate-500 uppercase">Tgl Audit</label><input type="date" className="mt-1 w-full border border-slate-300 rounded p-2 text-sm outline-none bg-white" value={metadata.tanggal} onChange={(e) => setMetadata({...metadata, tanggal: e.target.value})} /></div>
                            <div><label className="block text-xs font-bold text-slate-500 uppercase">Unit</label><select className="mt-1 w-full border border-slate-300 rounded p-2 text-sm bg-white outline-none" value={metadata.unit} onChange={(e) => setMetadata({...metadata, unit: e.target.value})} disabled={user.unit!=='ALL'}><option value="">Pilih...</option>{(user.unit==='ALL'?masterUnits:[user.unit]).map(u => <option key={u} value={u}>{u}</option>)}</select></div>
                            <div><label className="block text-xs font-bold text-slate-500 uppercase">Auditor</label><input type="text" className="mt-1 w-full bg-slate-100 border border-slate-300 rounded p-2 text-sm" value={metadata.auditor} disabled /></div>
                        </div>
                        <div className="border-b border-slate-200 mb-4 flex space-x-2">
                            {Object.keys(AUDIT_BUNDLES).map(k => (
                                <button key={k} onClick={()=>setActiveBundle(k)} className={`pb-3 px-4 font-bold text-sm border-b-2 ${activeBundle===k ? 'border-teal-600 text-teal-700' : 'border-transparent text-slate-500 hover:text-slate-700'}`}>{k} {bundleRows[k].length>0 && `(${bundleRows[k].length})`}</button>
                            ))}
                        </div>
                        <AuditTable config={AUDIT_BUNDLES[activeBundle]} rows={bundleRows[activeBundle]} setRows={(r) => setBundleRows({...bundleRows, [activeBundle]: r})} />
                        <div className="mt-6 flex justify-end"><button onClick={handleSave} className={`flex items-center px-6 py-2 text-white rounded font-bold transition ${user.role === 'IPCLN' ? 'bg-amber-500 hover:bg-amber-600' : 'bg-teal-600 hover:bg-teal-700'}`}><i className="fa-solid fa-floppy-disk mr-2"></i> {user.role === 'IPCLN' ? 'Kirim ke IPCN (Draft)' : 'Simpan Audit'}</button></div>
                    </div>
                </div>
            );
        }

        function AuditTable({ config, rows, setRows }) {
            const addRow = () => {
                let r = { id: Date.now(), name: '', nrm: '', answers: {} };
                config.columns.forEach(c => r.answers[c.key] = null);
                setRows([...rows, r]);
            };
            const setAns = (id, k, v) => setRows(rows.map(r => r.id===id ? {...r, answers: {...r.answers, [k]: v}} : r));

            return (
                <div>
                    <div className="overflow-x-auto border border-slate-200 rounded-lg min-h-[250px]">
                        <table className="w-full text-sm text-left">
                            <thead className="bg-slate-50">
                                <tr>
                                    <th className="p-3 w-48">Pasien</th>
                                    {config.columns.map(c=>(
                                        <th key={c.key} className="p-2 text-center text-xs font-bold relative group cursor-help">
                                            <span className="border-b border-dotted border-slate-400">{c.label}</span>
                                            <div className="hidden group-hover:block absolute top-full left-1/2 -translate-x-1/2 mt-2 w-56 p-3 bg-slate-800 text-white text-[11px] rounded shadow-lg z-50 font-normal text-left whitespace-normal leading-relaxed before:content-[''] before:absolute before:bottom-full before:left-1/2 before:-translate-x-1/2 before:border-4 before:border-transparent before:border-b-slate-800">
                                                {c.desc}
                                            </div>
                                        </th>
                                    ))}
                                    <th className="p-2 text-center">%</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-200 bg-white">
                                {rows.length === 0 && (<tr><td colSpan={config.columns.length + 3} className="px-4 py-8 text-center text-slate-400 italic">Klik tombol "Tambah Pasien" untuk mulai observasi bundle.</td></tr>)}
                                {rows.map((r,i) => (
                                    <tr key={r.id}>
                                        <td className="p-2"><input placeholder="Nama Pasien" value={r.name} onChange={e=>{let nr=[...rows];nr[i].name=e.target.value;setRows(nr)}} className="w-full text-xs border rounded p-1 mb-1 outline-none focus:border-teal-500"/><input placeholder="No. RM" value={r.nrm} onChange={e=>{let nr=[...rows];nr[i].nrm=e.target.value;setRows(nr)}} className="w-full text-xs border rounded p-1 bg-slate-50 outline-none focus:border-teal-500"/></td>
                                        {config.columns.map(c => (
                                            <td key={c.key} className="p-1 align-middle text-center">
                                                <div className="flex justify-center space-x-1">
                                                    <button onClick={()=>setAns(r.id,c.key,'Y')} className={`px-2 py-1 border rounded text-xs font-bold ${r.answers[c.key]==='Y'?'bg-green-500 text-white border-green-600':'bg-white text-slate-400'}`}>Y</button>
                                                    <button onClick={()=>setAns(r.id,c.key,'T')} className={`px-2 py-1 border rounded text-xs font-bold ${r.answers[c.key]==='T'?'bg-red-500 text-white border-red-600':'bg-white text-slate-400'}`}>T</button>
                                                    <button onClick={()=>setAns(r.id,c.key,'NA')} className={`text-[10px] px-1 ${r.answers[c.key]==='NA'?'font-bold text-slate-800 underline':'text-slate-400'}`}>N/A</button>
                                                </div>
                                            </td>
                                        ))}
                                        <td className="p-2 text-center font-bold text-slate-700 bg-slate-50">{calculateCompliance(r.answers)}%</td>
                                        <td className="p-2 text-center"><button onClick={()=>setRows(rows.filter(x=>x.id!==r.id))} className="text-red-400"><i className="fa-solid fa-trash"></i></button></td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                    <button onClick={addRow} className="mt-3 text-sm font-bold text-teal-700 bg-teal-50 px-3 py-2 rounded-lg flex items-center border border-teal-200 hover:bg-teal-100"><i className="fa-solid fa-plus mr-2"></i>Tambah Pasien</button>
                </div>
            );
        }

        function VerifikasiModule({ audits, surveilans, setAudits, setSurveilans }) {
            const verify = (id, type) => {
                if(type==='A') setAudits(audits.map(a => a.id === id ? {...a, status: 'VERIFIED'} : a));
                if(type==='S') setSurveilans(surveilans.map(s => s.id === id ? {...s, status: 'VERIFIED'} : s));
            };
            const dAud = audits.filter(a => a.status === 'DRAFT');
            const dSurv = surveilans.filter(s => s.status === 'DRAFT');

            return (
                <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                    <h2 className="text-lg font-bold flex items-center mb-6"><i className="fa-solid fa-shield-halved text-teal-600 mr-2"></i> Verifikasi Data Draft dari IPCLN</h2>
                    {dAud.length===0 && dSurv.length===0 ? (
                        <div className="text-center p-8 text-slate-500">
                            <i className="fa-solid fa-circle-check text-5xl text-emerald-400 mb-4 block"></i>
                            <p className="font-bold text-lg">Semua data sudah terverifikasi.</p>
                            <p className="text-sm">Tidak ada dokumen draft yang menunggu antrean verifikasi.</p>
                        </div>
                    ) : (
                        <div className="space-y-4">
                            {dSurv.map(s => (
                                <div key={s.id} className="border-l-4 border-rose-500 bg-rose-50 p-4 rounded flex justify-between items-center shadow-sm">
                                    <div>
                                        <p className="font-bold text-sm text-slate-800">[SURVEILANS HAIs] Periode: <span className="text-rose-600">{s.metadata.bulan}</span> | Unit: {s.metadata.unit}</p>
                                        <p className="text-xs text-slate-600 mt-1">Dilaporkan Oleh: {s.metadata.ipcln} pada {s.metadata.tglPengisian}</p>
                                    </div>
                                    <button onClick={()=>verify(s.id,'S')} className="bg-emerald-600 hover:bg-emerald-700 transition text-white text-xs font-bold px-4 py-2 rounded shadow-sm"><i className="fa-solid fa-check mr-1"></i> Verifikasi Data</button>
                                </div>
                            ))}
                            {dAud.map(a => (
                                <div key={a.id} className="border-l-4 border-blue-500 bg-blue-50 p-4 rounded flex justify-between items-center shadow-sm">
                                    <div>
                                        <p className="font-bold text-sm text-slate-800">[AUDIT BUNDLE] Tanggal Audit: <span className="text-blue-600">{a.metadata.tanggal}</span> | Unit: {a.metadata.unit}</p>
                                        <p className="text-xs text-slate-600 mt-1">Dilaporkan Oleh: {a.metadata.auditor}</p>
                                    </div>
                                    <button onClick={()=>verify(a.id,'A')} className="bg-emerald-600 hover:bg-emerald-700 transition text-white text-xs font-bold px-4 py-2 rounded shadow-sm"><i className="fa-solid fa-check mr-1"></i> Verifikasi Data</button>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        function DashboardModule({ audits, surveilans, denominators, units }) {
            const [filterMonth, setFilterMonth] = useState(new Date().toISOString().slice(0,7)); 
            const [filterUnit, setFilterUnit] = useState('ALL');

            const { rateData, compData, kpi } = useMemo(() => {
                const vSurv = surveilans.filter(s => s.status === 'VERIFIED' && s.metadata.bulan === filterMonth && (filterUnit === 'ALL' || s.metadata.unit === filterUnit));
                const vAud = audits.filter(a => a.status === 'VERIFIED' && a.metadata.tanggal.startsWith(filterMonth) && (filterUnit === 'ALL' || a.metadata.unit === filterUnit));
                
                let den = { hr:0, kat:0, cvc:0, vent:0, iv:0, op:0 };
                denominators.filter(d => d.bulan === filterMonth && (filterUnit === 'ALL' || d.unit === filterUnit)).forEach(d => {
                    den.hr += d.hariRawat; den.kat += d.hariKateter; den.cvc += d.hariCVC; den.vent += d.hariVentilator; den.iv += d.hariIVLine; den.op += d.jumlahOperasi;
                });

                let c = { isk:0, iadp:0, vap:0, pleb:0, ido:0 };
                vSurv.forEach(s => { c.isk += s.data.ISK.length; c.iadp += s.data.IADP.length; c.vap += s.data.VAP.length; c.pleb += s.data.PLEBITIS.length; c.ido += s.data.IDO.length; });

                const rData = [
                    { name: 'ISK (‰)', rate: den.kat>0 ? Number(((c.isk/den.kat)*1000).toFixed(2)) : 0, target: TARGETS.ISK, case: c.isk, dn: den.kat },
                    { name: 'IADP (‰)', rate: den.cvc>0 ? Number(((c.iadp/den.cvc)*1000).toFixed(2)) : 0, target: TARGETS.IADP, case: c.iadp, dn: den.cvc },
                    { name: 'VAP (‰)', rate: den.vent>0 ? Number(((c.vap/den.vent)*1000).toFixed(2)) : 0, target: TARGETS.VAP, case: c.vap, dn: den.vent },
                    { name: 'Plebitis (‰)', rate: den.iv>0 ? Number(((c.pleb/den.iv)*1000).toFixed(2)) : 0, target: TARGETS.PLEBITIS, case: c.pleb, dn: den.iv },
                    { name: 'IDO (%)', rate: den.op>0 ? Number(((c.ido/den.op)*100).toFixed(2)) : 0, target: TARGETS.IDO, case: c.ido, dn: den.op },
                ];

                let tComp=0, cntAud=0;
                const processA = (arr) => arr.forEach(r => { let score = calculateCompliance(r.answers); if(score>0){ tComp+=score; cntAud++; } });
                vAud.forEach(a => { processA(a.data.CAUTI||[]); processA(a.data.CLABSI||[]); processA(a.data.VAP||[]); processA(a.data.IDO||[]); });

                return { rateData: rData, compData: [], kpi: { cases: c.isk+c.iadp+c.vap+c.pleb+c.ido, avgComp: cntAud>0 ? Math.round(tComp/cntAud) : 0, noDen: (den.kat+den.cvc+den.vent+den.iv+den.op === 0) } };
            }, [audits, surveilans, denominators, filterMonth, filterUnit]);

            return (
                <div className="space-y-6">
                    <div className="flex flex-col md:flex-row justify-between mb-4 gap-4">
                        <div>
                            <h2 className="text-2xl font-bold text-slate-800">Dashboard Mutu PPI</h2>
                            <p className="text-sm text-slate-500">Analisis Insidence Rate HAIs vs Target Batas Nasional.</p>
                        </div>
                        <div className="flex space-x-2 bg-white p-1 rounded-lg border shadow-sm items-center h-fit">
                            <i className="fa-solid fa-filter text-slate-400 ml-2"></i>
                            <input type="month" value={filterMonth} onChange={e=>setFilterMonth(e.target.value)} className="border-none bg-slate-50 px-2 py-1 rounded text-sm font-bold outline-none text-slate-700" />
                            <select value={filterUnit} onChange={e=>setFilterUnit(e.target.value)} className="border-none bg-slate-50 px-2 py-1 rounded text-sm font-bold outline-none text-slate-700">
                                <option value="ALL">Semua Unit</option>
                                {units.map(u => <option key={u} value={u}>{u}</option>)}
                            </select>
                        </div>
                    </div>

                    {kpi.noDen && (
                        <div className="bg-amber-50 border border-amber-200 p-4 rounded-xl flex items-start text-amber-800 shadow-sm animate-pulse">
                            <i className="fa-solid fa-circle-exclamation text-xl mr-3 shrink-0 mt-0.5"></i>
                            <div>
                                <h4 className="font-bold text-sm">Peringatan: Data Denominator (Hari Alat) Periode Ini Belum Tersedia</h4>
                                <p className="text-xs mt-1">Sistem mendeteksi bahwa total hari terpasang alat (pembagi) adalah 0 pada periode/unit yang dipilih. <b>Tingkat Insiden / Rate (‰) tidak dapat dihitung dengan benar jika nilai pembagi kosong.</b> Harap tugaskan IPCLN untuk menginput Denominator akhir bulan melalui menu Denominator.</p>
                            </div>
                        </div>
                    )}

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div className="bg-white border border-slate-200 p-5 rounded-xl flex items-center space-x-4 shadow-sm relative overflow-hidden">
                            <div className="absolute top-0 right-0 w-16 h-16 bg-emerald-50 rounded-bl-full -mr-4 -mt-4 z-0"></div>
                            <div className="p-3 bg-emerald-100 rounded-lg shadow-sm z-10"><i className="fa-solid fa-clipboard-check text-emerald-600 text-xl"></i></div>
                            <div className="z-10"><p className="text-xs font-bold text-slate-500 uppercase">Rata-rata Kepatuhan Bundle</p><h4 className="text-2xl font-bold text-emerald-700">{kpi.avgComp}%</h4></div>
                        </div>
                        <div className="bg-white border border-slate-200 p-5 rounded-xl flex items-center space-x-4 shadow-sm relative overflow-hidden">
                            <div className="absolute top-0 right-0 w-16 h-16 bg-rose-50 rounded-bl-full -mr-4 -mt-4 z-0"></div>
                            <div className="p-3 bg-rose-100 rounded-lg shadow-sm z-10"><i className="fa-solid fa-chart-line text-rose-600 text-xl"></i></div>
                            <div className="z-10"><p className="text-xs font-bold text-slate-500 uppercase">Total Kasus Infeksi (HAIs)</p><h4 className="text-2xl font-bold text-rose-700">{kpi.cases} Kasus</h4></div>
                        </div>
                        <div className="bg-white border border-slate-200 p-5 rounded-xl flex items-center space-x-4 shadow-sm relative overflow-hidden">
                            <div className="absolute top-0 right-0 w-16 h-16 bg-blue-50 rounded-bl-full -mr-4 -mt-4 z-0"></div>
                            <div className="p-3 bg-blue-100 rounded-lg shadow-sm z-10"><i className="fa-solid fa-database text-blue-600 text-xl"></i></div>
                            <div className="z-10"><p className="text-xs font-bold text-slate-500 uppercase">Status Kelengkapan Data</p><h4 className={`text-lg font-bold ${kpi.noDen ? 'text-amber-600' : 'text-blue-700'}`}>{kpi.noDen ? 'Incomplete (No Denominator)' : 'Siap Cetak Laporan'}</h4></div>
                        </div>
                    </div>

                    <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 mt-6">
                        <h3 className="text-base font-bold text-slate-800 mb-6 flex items-center">
                            <i className="fa-solid fa-chart-simple text-teal-600 mr-2"></i> Grafik Insidence Rate HAIs vs Target Batas Atas RS
                        </h3>
                        <div className="h-80 w-full">
                            <ResponsiveContainer width="100%" height="100%">
                                <ComposedChart data={rateData} margin={{ top: 20, right: 30, left: 0, bottom: 5 }}>
                                    <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#e2e8f0" />
                                    <XAxis dataKey="name" tick={{fontSize: 12, fill: '#475569'}} axisLine={false} tickLine={false} />
                                    <YAxis tick={{fontSize: 12, fill: '#475569'}} axisLine={false} tickLine={false} />
                                    <RechartsTooltip cursor={{fill: '#f8fafc'}} contentStyle={{borderRadius: '8px', border: '1px solid #e2e8f0', boxShadow: '0 4px 6px -1px rgb(0 0 0 / 0.1)'}} formatter={(val, name, props) => { if(name==='Target Maks (RS)') return [val, 'Batas Target']; return [`${val} (Jml Kasus: ${props.payload.case} | Hr Alat: ${props.payload.dn})`, 'Rate Insiden']; }} />
                                    <Legend wrapperStyle={{fontSize: '12px'}} />
                                    <Bar dataKey="rate" name="Rate Insiden Aktual" barSize={50} radius={[4, 4, 0, 0]}>
                                        {rateData.map((e, i) => <Cell key={i} fill={e.rate > e.target ? '#ef4444' : '#14b8a6'} />)}
                                    </Bar>
                                    <Line type="step" dataKey="target" name="Target Maks (RS)" stroke="#ef4444" strokeWidth={2} strokeDasharray="5 5" dot={false} />
                                </ComposedChart>
                            </ResponsiveContainer>
                        </div>
                        <div className="flex items-center justify-center space-x-6 text-[10px] text-slate-500 mt-4 border-t border-slate-100 pt-4">
                            <div className="flex items-center"><div className="w-3 h-3 bg-teal-500 rounded-sm mr-2"></div> Di Bawah Target Nasional (Mutu Aman)</div>
                            <div className="flex items-center"><div className="w-3 h-3 bg-red-500 rounded-sm mr-2"></div> Melebihi Batas Target Nasional (Perlu Evaluasi)</div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<HAIsApp />);
    </script>
</body>
</html>
