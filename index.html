<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Surveilans & Audit HAIs</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/recharts@2.1.9/umd/Recharts.js"></script>
    
    <style>
        .tooltip-container { position: relative; display: inline-block; cursor: help; border-bottom: 1px dotted #666; }
        .tooltip-container .tooltip-text {
            visibility: hidden; width: 250px; background-color: #1f2937; color: #fff; text-align: center;
            border-radius: 6px; padding: 8px; position: absolute; z-index: 50; bottom: 125%; left: 50%;
            margin-left: -125px; opacity: 0; transition: opacity 0.3s; font-size: 12px; font-weight: normal; line-height: 1.4;
        }
        .tooltip-container .tooltip-text::after {
            content: ""; position: absolute; top: 100%; left: 50%; margin-left: -5px;
            border-width: 5px; border-style: solid; border-color: #1f2937 transparent transparent transparent;
        }
        .tooltip-container:hover .tooltip-text { visibility: visible; opacity: 1; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip: RechartsTooltip, Legend, ResponsiveContainer, ReferenceLine } = window.Recharts;

        const HeaderTooltip = ({ title, desc }) => (
            <div className="tooltip-container text-xs font-bold text-gray-700">
                {title}
                <span className="tooltip-text">{desc}</span>
            </div>
        );

        function App() {
            const [user, setUser] = useState(null);
            const [activeTab, setActiveTab] = useState('audit');
            
            // Database Simulasi
            const [usersList, setUsersList] = useState(() => JSON.parse(localStorage.getItem('ppi_users')) || [
                { id: 1, username: 'admin_ipcn', password: '123', role: 'IPCN', unit: 'Semua' },
                { id: 2, username: 'perawat_icu', password: '123', role: 'IPCLN', unit: 'ICU' }
            ]);
            
            useEffect(() => { localStorage.setItem('ppi_users', JSON.stringify(usersList)); }, [usersList]);

            // Form States
            const [loginForm, setLoginForm] = useState({ username: '', password: '' });
            const [newUser, setNewUser] = useState({ username: '', password: '', role: 'IPCLN', unit: '' });
            const [editingUserId, setEditingUserId] = useState(null);
            const [activeSurvType, setActiveSurvType] = useState('IDO');

            const handleLogin = (e) => {
                e.preventDefault();
                const foundUser = usersList.find(u => u.username === loginForm.username && u.password === loginForm.password);
                if (foundUser) setUser(foundUser);
                else alert('Username atau Password salah!');
            };

            // FUNGSI UPDATE/EDIT USER
            const handleUserSubmit = (e) => {
                e.preventDefault();
                if (editingUserId) {
                    setUsersList(usersList.map(u => u.id === editingUserId ? { ...newUser, id: editingUserId } : u));
                    setEditingUserId(null);
                    alert("Data user berhasil diupdate!");
                } else {
                    setUsersList([...usersList, { ...newUser, id: Date.now() }]);
                    alert("User baru berhasil ditambahkan!");
                }
                setNewUser({ username: '', password: '', role: 'IPCLN', unit: '' });
            };

            const handleEditUser = (u) => {
                setEditingUserId(u.id);
                setNewUser({ username: u.username, password: u.password, role: u.role, unit: u.unit });
            };

            if (!user) {
                return (
                    <div className="flex items-center justify-center min-h-screen bg-teal-700">
                        <div className="bg-white p-8 rounded-lg shadow-xl w-96 fade-in">
                            <h2 className="text-2xl font-bold mb-6 text-center text-teal-800">Login SIM-PPI</h2>
                            <form onSubmit={handleLogin} className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium mb-1">Username</label>
                                    <input type="text" className="w-full border p-2 rounded" required value={loginForm.username} onChange={e => setLoginForm({...loginForm, username: e.target.value})} />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium mb-1">Password</label>
                                    <input type="password" className="w-full border p-2 rounded" required value={loginForm.password} onChange={e => setLoginForm({...loginForm, password: e.target.value})} />
                                </div>
                                <button type="submit" className="w-full bg-teal-600 text-white font-bold p-2 rounded hover:bg-teal-700">Masuk</button>
                            </form>
                            <p className="mt-4 text-xs text-center text-gray-500">Gunakan <b>admin_ipcn</b> / pass: <b>123</b></p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex bg-gray-100 min-h-screen font-sans">
                    {/* SIDEBAR */}
                    <div className="w-64 bg-teal-800 text-white shadow-lg flex flex-col fixed h-full z-10">
                        <div className="p-4 bg-teal-900"><h2 className="text-xl font-bold text-center">SIM-PPI</h2></div>
                        <div className="p-4 bg-teal-700 mb-2 border-b border-teal-600">
                            <p className="text-sm font-bold">{user.username}</p>
                            <p className="text-xs text-teal-200">{user.role} - {user.unit}</p>
                        </div>
                        <nav className="flex-1 space-y-1 p-2">
                            <button onClick={() => setActiveTab('audit')} className={`w-full text-left p-3 rounded text-sm font-medium ${activeTab === 'audit' ? 'bg-teal-600' : 'hover:bg-teal-600'}`}>📋 Audit Bundle HAIs</button>
                            <button onClick={() => setActiveTab('surveilans')} className={`w-full text-left p-3 rounded text-sm font-medium ${activeTab === 'surveilans' ? 'bg-teal-600' : 'hover:bg-teal-600'}`}>🦠 Surveilans & Kasus</button>
                            {user.role === 'IPCN' && (
                                <button onClick={() => setActiveTab('master')} className={`w-full text-left p-3 rounded text-sm font-medium ${activeTab === 'master' ? 'bg-teal-600' : 'hover:bg-teal-600'}`}>⚙️ Manajemen User</button>
                            )}
                        </nav>
                        <button onClick={() => setUser(null)} className="m-4 bg-red-600 hover:bg-red-700 p-2 rounded text-white font-bold text-sm text-center">Logout</button>
                    </div>

                    {/* KONTEN UTAMA */}
                    <main className="flex-1 ml-64 p-8 overflow-y-auto">
                        
                        {/* TAB: AUDIT BUNDLE */}
                        {activeTab === 'audit' && (
                            <div className="fade-in">
                                <h1 className="text-2xl font-bold text-teal-800 mb-2">Audit Kepatuhan Bundle HAIs</h1>
                                <p className="text-sm text-gray-600 mb-6">Arahkan kursor ke kriteria (teks bergaris bawah) untuk melihat definisi operasional.</p>

                                {/* CAUTI */}
                                <div className="bg-white p-4 rounded shadow mb-6 border-l-4 border-blue-500 overflow-x-auto">
                                    <h2 className="text-lg font-bold text-blue-800 mb-4">Bundle CAUTI (ISK)</h2>
                                    <table className="w-full text-sm border-collapse min-w-[800px]">
                                        <thead>
                                            <tr className="bg-gray-100">
                                                <th className="p-2 border text-left w-48">Nama Pasien</th>
                                                <th className="p-2 border"><HeaderTooltip title="Indikasi Terdok." desc="Indikasi pemasangan kateter terdokumentasi di CPPT / rekam medis (bukan hanya kenyamanan pasien)" /></th>
                                                <th className="p-2 border"><HeaderTooltip title="Closed System" desc="Sistem drainase tertutup (closed system) terpasang dan tidak ada kebocoran" /></th>
                                                <th className="p-2 border"><HeaderTooltip title="Bag Di Bawah" desc="Posisi drainage bag: selalu di bawah pinggang pasien — tidak pernah di lantai atau lebih tinggi dari kandung kemih" /></th>
                                                <th className="p-2 border"><HeaderTooltip title="Selang Tdk Tekuk" desc="Selang kateter tidak tertekuk / terjepit / tersumbat" /></th>
                                                <th className="p-2 border"><HeaderTooltip title="Daily Reassess." desc="Re-assessment kebutuhan kateter dilakukan setiap hari — bila tidak diperlukan, kateter dicabut" /></th>
                                                <th className="p-2 border"><HeaderTooltip title="Perawatan Harian" desc="Perawatan kateter harian dilakukan (meatus uretra dibersihkan sesuai SPO)" /></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr>
                                                <td className="p-2 border"><input type="text" className="w-full border p-1 rounded" placeholder="Nama Pasien..." /></td>
                                                <td className="p-2 border text-center"><input type="checkbox" /></td><td className="p-2 border text-center"><input type="checkbox" /></td><td className="p-2 border text-center"><input type="checkbox" /></td><td className="p-2 border text-center"><input type="checkbox" /></td><td className="p-2 border text-center"><input type="checkbox" /></td><td className="p-2 border text-center"><input type="checkbox" /></td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>

                                {/* CLABSI */}
                                <div className="bg-white p-4 rounded shadow mb-6 border-l-4 border-red-500 overflow-x-auto">
                                    <h2 className="text-lg font-bold text-red-800 mb-4">Bundle CLABSI (IADP)</h2>
                                    <table className="w-full text-sm border-collapse min-w-[800px]">
                                        <thead>
                                            <tr className="bg-gray-100">
                                                <th className="p-2 border text-left w-48">Nama Pasien</th>
                                                <th className="p-2 border"><HeaderTooltip title="Indikasi Terdok." desc="Indikasi pemasangan CVC / line sentral terdokumentasi dan dievaluasi setiap hari" /></th>
                                                <th className="p-2 border"><HeaderTooltip title="Max Sterile Barrier" desc="Maximal Sterile Barrier Precautions saat insersi: cap, masker, gaun steril, sarung tangan steril, draping steril seluruh tubuh" /></th>
                                                <th className="p-2 border"><HeaderTooltip title="Antisepsis Kulit" desc="Antisepsis kulit menggunakan chlorhexidine ≥ 0.5% dalam alkohol — dibiarkan kering sebelum insersi" /></th>
                                                <th className="p-2 border"><HeaderTooltip title="Dressing Utuh" desc="Dressing / verban insersi bersih, kering, dan utuh — diganti sesuai jadwal atau segera bila kotor/basah" /></th>
                                                <th className="p-2 border"><HeaderTooltip title="Scrub the Hub" desc="Port / hub line dibersihkan dengan alkohol 70% minimal 15 detik setiap kali sebelum akses (scrub the hub)" /></th>
                                                <th className="p-2 border"><HeaderTooltip title="Daily Reassess." desc="Kebutuhan CVC dievaluasi setiap hari — line dicabut segera bila tidak diperlukan" /></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr>
                                                <td className="p-2 border"><input type="text" className="w-full border p-1 rounded" placeholder="Nama Pasien..." /></td>
                                                <td className="p-2 border text-center"><input type="checkbox" /></td><td className="p-2 border text-center"><input type="checkbox" /></td><td className="p-2 border text-center"><input type="checkbox" /></td><td className="p-2 border text-center"><input type="checkbox" /></td><td className="p-2 border text-center"><input type="checkbox" /></td><td className="p-2 border text-center"><input type="checkbox" /></td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>

                                {/* VAP */}
                                <div className="bg-white p-4 rounded shadow mb-6 border-l-4 border-green-500 overflow-x-auto">
                                    <h2 className="text-lg font-bold text-green-800 mb-4">Bundle VAP</h2>
                                    <table className="w-full text-sm border-collapse min-w-[800px]">
                                        <thead>
                                            <tr className="bg-gray-100">
                                                <th className="p-2 border text-left w-48">Nama Pasien</th>
                                                <th className="p-2 border"><HeaderTooltip title="HOB 30–45°" desc="Posisi kepala tempat tidur 30–45° (semi-recumbent) — kecuali ada kontraindikasi medis" /></th>
                                                <th className="p-2 border"><HeaderTooltip title="Oral Hygiene" desc="Oral hygiene dilakukan minimal setiap 4 jam menggunakan chlorhexidine 0.12% atau sesuai protokol" /></th>
                                                <th className="p-2 border"><HeaderTooltip title="Cuff Pressure" desc="Tekanan cuff (manset) ETT dipertahankan 20–30 cmH₂O — diperiksa dan dicatat setiap shift" /></th>
                                                <th className="p-2 border"><HeaderTooltip title="SAT/SBT Dilakukan" desc="Sedation vacation (SAT) dan Spontaneous Breathing Trial (SBT) dilakukan dan didokumentasikan" /></th>
                                                <th className="p-2 border"><HeaderTooltip title="Water Trap OK" desc="Air dalam water trap / humidifier dikosongkan secara berkala agar tidak masuk ke jalan napas" /></th>
                                                <th className="p-2 border"><HeaderTooltip title="Daily Extubasi Eval." desc="Kebutuhan ventilator mekanik dievaluasi setiap hari untuk rencana extubasi sedini mungkin" /></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr>
                                                <td className="p-2 border"><input type="text" className="w-full border p-1 rounded" placeholder="Nama Pasien..." /></td>
                                                <td className="p-2 border text-center"><input type="checkbox" /></td><td className="p-2 border text-center"><input type="checkbox" /></td><td className="p-2 border text-center"><input type="checkbox" /></td><td className="p-2 border text-center"><input type="checkbox" /></td><td className="p-2 border text-center"><input type="checkbox" /></td><td className="p-2 border text-center"><input type="checkbox" /></td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>

                                {/* IDO */}
                                <div className="bg-white p-4 rounded shadow mb-6 border-l-4 border-yellow-500 overflow-x-auto">
                                    <h2 className="text-lg font-bold text-yellow-800 mb-4">Bundle IDO</h2>
                                    <table className="w-full text-sm border-collapse min-w-[800px]">
                                        <thead>
                                            <tr className="bg-gray-100">
                                                <th className="p-2 border text-left w-48">Nama Pasien</th>
                                                <th className="p-2 border"><HeaderTooltip title="Profilaksis Tepat Waktu" desc="Profilaksis antibiotik diberikan dalam 60 menit sebelum insisi" /></th>
                                                <th className="p-2 border"><HeaderTooltip title="Jenis/Dosis Sesuai" desc="Jenis dan dosis antibiotik profilaksis sesuai panduan / formularium RS" /></th>
                                                <th className="p-2 border"><HeaderTooltip title="Ab Stop < 24 jam" desc="Antibiotik profilaksis dihentikan dalam 24 jam pasca operasi" /></th>
                                                <th className="p-2 border"><HeaderTooltip title="Normotermia" desc="Suhu tubuh pasien terjaga (normotermia intraoperatif): target 36–37.5°C" /></th>
                                                <th className="p-2 border"><HeaderTooltip title="GD Terkontrol" desc="Kadar glukosa darah intraoperatif dan 48 jam pasca operasi terkontrol (< 200 mg/dL)" /></th>
                                                <th className="p-2 border"><HeaderTooltip title="SSC Lengkap" desc="Surgical Safety Checklist (Sign-In, Time-Out, Sign-Out) dilengkapi dengan benar" /></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr>
                                                <td className="p-2 border"><input type="text" className="w-full border p-1 rounded" placeholder="Nama Pasien..." /></td>
                                                <td className="p-2 border text-center"><input type="checkbox" /></td><td className="p-2 border text-center"><input type="checkbox" /></td><td className="p-2 border text-center"><input type="checkbox" /></td><td className="p-2 border text-center"><input type="checkbox" /></td><td className="p-2 border text-center"><input type="checkbox" /></td><td className="p-2 border text-center"><input type="checkbox" /></td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* TAB: SURVEILANS */}
                        {activeTab === 'surveilans' && (
                            <div className="fade-in">
                                <h1 className="text-2xl font-bold text-teal-800 mb-6">Pencatatan Surveilans HAIs</h1>
                                
                                <div className="flex flex-wrap gap-2 mb-6">
                                    {['IDO', 'ISK (CAUTI)', 'IADP (CLABSI)', 'VAP', 'Plebitis'].map(type => (
                                        <button key={type} onClick={() => setActiveSurvType(type)} className={`px-4 py-2 text-sm font-bold rounded ${activeSurvType === type ? 'bg-teal-600 text-white' : 'bg-gray-200 text-gray-600 hover:bg-gray-300'}`}>
                                            {type}
                                        </button>
                                    ))}
                                </div>

                                <div className="bg-white p-6 rounded shadow border-t-4 border-teal-500 mb-6">
                                    {activeSurvType === 'IDO' && (
                                        <div className="mb-6 bg-blue-50 p-4 rounded border border-blue-100">
                                            <h3 className="font-bold text-blue-900 mb-2">Definisi & Kriteria Surveilans IDO</h3>
                                            <p className="text-sm text-gray-700 mb-2">Infeksi yang terjadi pada atau dekat lokasi insisi bedah dalam 30 hari pasca operasi (atau 90 hari untuk prosedur dengan implant).</p>
                                            <ul className="text-sm text-gray-700 list-disc ml-5 space-y-1">
                                                <li><b>Superfisial (S):</b> Infeksi kulit/subkutan di lokasi insisi dalam 30 hari. Tanda: nyeri/bengkak/kemerahan/panas + drainase purulen atau kultur positif.</li>
                                                <li><b>Dalam/Deep (D):</b> Infeksi jaringan lunak dalam (fasia/otot) dalam 30 hari. Tanda: demam > 38°C + nyeri tekan + dehiscence/abses dalam.</li>
                                                <li><b>Organ/Space (O):</b> Infeksi pada organ atau rongga tubuh yang dibuka saat operasi. Dibuktikan dengan kultur positif, abses, atau radiologi.</li>
                                            </ul>
                                        </div>
                                    )}
                                    
                                    {activeSurvType === 'ISK (CAUTI)' && (
                                        <div className="mb-6 bg-blue-50 p-4 rounded border border-blue-100">
                                            <h3 className="font-bold text-blue-900 mb-2">Definisi & Kriteria Surveilans ISK (CAUTI)</h3>
                                            <p className="text-sm text-gray-700 mb-2">Infeksi saluran kemih yang terjadi pada pasien yang menggunakan kateter urin lebih dari 2 hari kalender.</p>
                                            <ul className="text-sm text-gray-700 list-disc ml-5 space-y-1">
                                                <li>Pasien terpasang kateter urin > 2 hari kalender pada saat onset gejala atau 1 hari sebelumnya.</li>
                                                <li>Setidaknya satu dari: demam > 38°C, urgensi berkemih, frekuensi, disuria, atau nyeri suprapubik.</li>
                                                <li>Kultur urin positif dengan ≥ 10⁵ CFU/mL dari ≤ 2 jenis mikroorganisme.</li>
                                            </ul>
                                        </div>
                                    )}

                                    {activeSurvType === 'IADP (CLABSI)' && (
                                        <div className="mb-6 bg-blue-50 p-4 rounded border border-blue-100">
                                            <h3 className="font-bold text-blue-900 mb-2">Definisi & Kriteria Surveilans IADP (CLABSI)</h3>
                                            <p className="text-sm text-gray-700 mb-2">Infeksi aliran darah yang terjadi pada pasien yang menggunakan central venous catheter (CVC) lebih dari 2 hari kalender.</p>
                                            <ul className="text-sm text-gray-700 list-disc ml-5 space-y-1">
                                                <li>Pasien terpasang CVC/line sentral > 2 hari kalender pada saat onset gejala atau 1 hari sebelumnya.</li>
                                                <li>Satu atau lebih hemokultur positif dari organisme yang bukan merupakan kontaminan umum.</li>
                                                <li>Bukan infeksi yang bersumber dari tempat lain (seperti UTI, pneumonia, atau IDO).</li>
                                            </ul>
                                        </div>
                                    )}

                                    {activeSurvType === 'VAP' && (
                                        <div className="mb-6 bg-blue-50 p-4 rounded border border-blue-100">
                                            <h3 className="font-bold text-blue-900 mb-2">Definisi & Kriteria Surveilans VAP</h3>
                                            <p className="text-sm text-gray-700 mb-2">Pneumonia yang berkembang pada pasien yang menggunakan ventilator mekanik invasif selama ≥ 48 jam.</p>
                                            <ul className="text-sm text-gray-700 list-disc ml-5 space-y-1">
                                                <li>Pasien menggunakan ventilator mekanik invasif ≥ 48 jam pada saat onset atau 1 hari sebelumnya.</li>
                                                <li>Infiltrat baru atau progresif pada rontgen thorax yang tidak dapat dijelaskan penyebab lain.</li>
                                                <li>Dua dari: demam > 38°C atau hipotermia < 36°C; leukositosis > 12.000 atau leukopenia < 4.000; sekresi trakea purulen.</li>
                                            </ul>
                                        </div>
                                    )}

                                    {activeSurvType === 'Plebitis' && (
                                        <div className="mb-6 bg-blue-50 p-4 rounded border border-blue-100">
                                            <h3 className="font-bold text-blue-900 mb-2">Definisi & Kriteria Surveilans Plebitis</h3>
                                            <p className="text-sm text-gray-700 mb-2">Inflamasi vena perifer yang ditandai dengan nyeri, kemerahan, bengkak, dan/atau teraba indurasi sepanjang jalur vena.</p>
                                            <ul className="text-sm text-gray-700 list-disc ml-5 space-y-1">
                                                <li><b>Derajat 1:</b> Kemerahan di lokasi insersi IV line, dengan atau tanpa nyeri lokal.</li>
                                                <li><b>Derajat 2:</b> Nyeri di lokasi insersi, dengan kemerahan dan/atau bengkak.</li>
                                                <li><b>Derajat 3:</b> Nyeri pada jalur vena, kemerahan, bengkak. Cord (pengerasan vena) teraba.</li>
                                                <li><b>Derajat 4:</b> Nyeri sepanjang jalur vena, kemerahan, bengkak, cord teraba > 2.5 cm. Eksudat purulen.</li>
                                                <li><b>Derajat 5:</b> Semua tanda di atas disertai demam, jaringan nekrotik.</li>
                                            </ul>
                                        </div>
                                    )}
                                    
                                    <div className="grid grid-cols-4 gap-4 bg-gray-50 p-4 border rounded">
                                        <input type="text" placeholder="Nama Pasien" className="border p-2 rounded text-sm" />
                                        <input type="text" placeholder="No Rekam Medis" className="border p-2 rounded text-sm" />
                                        <input type="date" className="border p-2 rounded text-sm" />
                                        <button className="bg-teal-600 text-white font-bold rounded hover:bg-teal-700">Simpan Draft Laporan</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB: DATA MASTER & USER */}
                        {activeTab === 'master' && user.role === 'IPCN' && (
                            <div className="fade-in">
                                <h1 className="text-2xl font-bold mb-6 text-teal-800">Manajemen Pengguna</h1>
                                <div className="bg-white p-6 rounded shadow mb-6 border-t-4 border-teal-500">
                                    <h3 className="font-bold mb-4">{editingUserId ? 'Ubah Data Pengguna (Edit)' : 'Tambah Pengguna Baru'}</h3>
                                    <form onSubmit={handleUserSubmit} className="grid grid-cols-2 gap-4">
                                        <input type="text" placeholder="Username" required className="border p-2 rounded" value={newUser.username} onChange={e => setNewUser({...newUser, username: e.target.value})} />
                                        <input type="text" placeholder="Password" required className="border p-2 rounded" value={newUser.password} onChange={e => setNewUser({...newUser, password: e.target.value})} />
                                        <select className="border p-2 rounded" value={newUser.role} onChange={e => setNewUser({...newUser, role: e.target.value})}>
                                            <option value="IPCLN">IPCLN (Ruangan)</option>
                                            <option value="IPCN">IPCN (Komite)</option>
                                            <option value="Manajemen">Manajemen (View Only)</option>
                                        </select>
                                        <input type="text" placeholder="Nama Unit (Misal: ICU)" className="border p-2 rounded" value={newUser.unit} onChange={e => setNewUser({...newUser, unit: e.target.value})} />
                                        <div className="col-span-2 flex gap-2">
                                            <button type="submit" className={`px-4 py-2 rounded text-white font-bold shadow ${editingUserId ? 'bg-blue-600 hover:bg-blue-700' : 'bg-teal-600 hover:bg-teal-700'}`}>
                                                {editingUserId ? 'Update Data Pengguna' : 'Tambah Pengguna'}
                                            </button>
                                            {editingUserId && (
                                                <button type="button" onClick={() => { setEditingUserId(null); setNewUser({ username: '', password: '', role: 'IPCLN', unit: '' }); }} className="bg-gray-400 text-white px-4 py-2 rounded font-bold shadow hover:bg-gray-500">Batal Edit</button>
                                            )}
                                        </div>
                                    </form>
                                </div>

                                <div className="bg-white rounded shadow overflow-hidden">
                                    <table className="w-full text-sm">
                                        <thead className="bg-gray-100">
                                            <tr>
                                                <th className="p-3 border-b text-left">Username</th>
                                                <th className="p-3 border-b text-left">Role</th>
                                                <th className="p-3 border-b text-left">Unit</th>
                                                <th className="p-3 border-b text-center">Aksi (Edit / Hapus)</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {usersList.map((u) => (
                                                <tr key={u.id} className="hover:bg-gray-50">
                                                    <td className="p-3 border-b font-medium">{u.username}</td>
                                                    <td className="p-3 border-b"><span className="bg-blue-100 text-blue-800 px-2 py-1 rounded text-xs font-bold">{u.role}</span></td>
                                                    <td className="p-3 border-b">{u.unit}</td>
                                                    <td className="p-3 border-b text-center">
                                                        <button onClick={() => handleEditUser(u)} className="bg-yellow-500 hover:bg-yellow-600 text-white px-3 py-1 rounded text-xs font-bold mr-2 shadow">Edit</button>
                                                        <button onClick={() => setUsersList(usersList.filter(user => user.id !== u.id))} className="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-xs font-bold shadow">Hapus</button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                        
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
